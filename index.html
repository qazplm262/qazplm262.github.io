<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eve 官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            /* 科技风背景 - 低饱和度渐变，不抢文字视觉 */
            background: linear-gradient(135deg, #000 0%, #0a192f 50%, #000 100%);
        }
        /* 雪花容器 - 层级最低，不遮挡任何内容，悬浮屏幕中 */
        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1; /* 低于所有内容 */
            overflow: hidden;
        }
        /* 雪花样式 - 中等大小，科技淡蓝，悬浮飘落 */
        .snowflake {
            position: absolute;
            color: #ffffff;
            opacity: 0.85;
            font-size: 14px;
            animation: snowfall linear infinite;
            /* 轻量辉光，不影响文字 */
            text-shadow: 0 0 3px rgba(100, 200, 255, 0.6);
            /* 初始在屏幕外上方，悬浮飘落 */
            top: -20px;
        }
        /* 雪花悬浮飘落动画 - 左右轻微晃动，更自然 */
        @keyframes snowfall {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.85;
            }
            90% {
                opacity: 0.85;
            }
            100% {
                /* 左右随机晃动，悬浮在屏幕中飘落 */
                transform: translateY(100vh) translateX(50px) rotate(360deg);
                opacity: 0;
            }
        }
        /* 左侧竖排滑入提示 */
        .slide-tip {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            transform-origin: left center;
            font-size: 18px;
            color: #ccc;
            letter-spacing: 2px;
            cursor: pointer;
            z-index: 100;
            /* 文字清晰化 */
            text-shadow: none;
        }
        /* 页面容器 - 丝滑切换核心 */
        .page-container {
            width: 200vw;
            height: 100vh;
            display: flex;
            transition: transform 0.5s ease-in-out;
            z-index: 2;
            position: relative;
        }
        .page {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative;
        }
        /* 切换后偏移 */
        .page-container.slide {
            transform: translateX(-100vw);
        }
        /* 通用样式 - 核心：移除文字模糊阴影，保证清晰 */
        .title {
            font-size: 32px;
            margin-bottom: 20px;
            color: #fff;
            letter-spacing: 2px;
            z-index: 3;
            text-shadow: 0 0 4px rgba(66, 133, 244, 0.3); /* 轻量光效，不模糊 */
        }
        .desc {
            font-size: 16px;
            line-height: 1.8;
            max-width: 600px;
            margin-bottom: 40px;
            color: #ccc;
            z-index: 3;
            text-shadow: none; /* 完全移除阴影，保证文字清晰 */
        }
        .btn {
            display: inline-block;
            padding: 14px 30px;
            margin: 10px;
            background-color: #222;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s;
            z-index: 3;
            position: relative;
            /* 科技风按钮 - 轻量阴影，不模糊 */
            box-shadow: 0 0 4px rgba(66, 133, 244, 0.2);
            text-shadow: none;
        }
        .btn:hover {
            background-color: #111;
            border-color: #66bfff;
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(66, 133, 244, 0.6); /* hover增强光效 */
        }
        /* 付费端专属样式 - 折扣文字清晰化 */
        .pay-desc {
            line-height: 2;
            text-shadow: none;
        }
        .discount {
            color: #ff4d4d;
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
            z-index: 3;
            /* 轻量红光效，不模糊文字 */
            text-shadow: 0 0 4px rgba(255, 77, 77, 0.4);
        }
    </style>
</head>
<body>
    <!-- 飘雪容器 -->
    <div class="snow-container" id="snowContainer"></div>
    <!-- 左侧竖排滑入提示 -->
    <div class="slide-tip" id="slideTip">往右滑</div>
    <!-- 双页面容器 -->
    <div class="page-container" id="pageContainer">

            <a href="https://b23.tv/Ie0P5AP" target="_blank" class="btn">前往 B 站主页</a>

        </div>
        <!-- BladeFury 付费端页面 -->
        <div class="page" id="payPage">
            <div class="title">欢迎来到BladeFury Client官网</div>
            <div class="desc pay-desc">
                BladeFury Client采用好看的材质，丝滑的手感，让你打起床不会输，让你生存。一次性通关<br>

            <a href="https://buy.jry0.com/shop/XiaoFan" target="_blank" class="btn">进入店铺</a>
        </div>
    </div>
    <script>
        // 雪花生成逻辑 - 中等数量40片，悬浮屏幕中飘落，动态持续生成
        const snowContainer = document.getElementById('snowContainer');
        const snowCount = 40; // 中等雪花数量
        const snowChars = ['❄', '❅', '❆'];
        // 持续生成雪花，实现动态悬浮效果
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            snowflake.innerText = snowChars[Math.floor(Math.random() * snowChars.length)];
            // 随机位置（屏幕宽度内）、大小、动画时长，实现悬浮飘落
            const left = Math.random() * 100; // 水平随机，悬浮屏幕中
            const size = Math.random() * 8 + 12; // 12-20px 中等大小
            const duration = Math.random() * 15 + 10; // 10-25s 适中飘落速度
            const opacity = Math.random() * 0.4 + 0.5; // 0.5-0.9 适中透明度

            snowflake.style.left = `${left}%`;
            snowflake.style.fontSize = `${size}px`;
            snowflake.style.animationDuration = `${duration}s`;
            snowflake.style.opacity = opacity;

            snowContainer.appendChild(snowflake);
            // 雪花落地后移除，避免节点堆积
            setTimeout(() => {
                snowflake.remove();
            }, duration * 1000);
        }
        // 初始化生成+持续生成，实现动态悬浮效果
        for (let i = 0; i < snowCount; i++) {
            setTimeout(createSnowflake, Math.random() * 3000);
        }
        setInterval(createSnowflake, 500); // 每隔0.5s生成一个，动态循环

        // 原有页面切换逻辑 - 完全保留，无任何修改
        const slideTip = document.getElementById('slideTip');
        const pageContainer = document.getElementById('pageContainer');
        let isSlide = false;
        slideTip.addEventListener('click', () => {
            pageContainer.classList.toggle('slide');
            isSlide = !isSlide;
            slideTip.innerText = isSlide ? '往左滑' : '往右滑';
        });
        let startX = 0;
        document.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });
        document.addEventListener('mousedown', (e) => {
            startX = e.clientX;
        });
        function handleEnd(e) {
            const endX = e.type === 'touchend' ? e.changedTouches[0].clientX : e.clientX;
            const diffX = startX - endX;
            if (diffX > 50 && !isSlide) {
                pageContainer.classList.add('slide');
                slideTip.innerText = '往左滑';
                isSlide = true;
            } else if (diffX < -50 && isSlide) {
                pageContainer.classList.remove('slide');
                slideTip.innerText = '往右滑';
                isSlide = false;
            }
        }
        document.addEventListener('touchend', handleEnd);
        document.addEventListener('mouseup', handleEnd);
    </script>
</body>
</html>
