        * {
            margin: 0;
            padding: 0;

            user-select: none;
        }
        body {
            background: #000;
            color: #fff;
            font-family: "Microsoft YaHei", sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
            /* 轻量科技风纹理背景 - 零性能损耗 */
            background: #000 url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h20v20H0V0zm2 2v16h16V2H2z' fill='%230a2a4a' fill-opacity='0.3' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        /* 左侧竖排滑切提示 - 科技霓虹光效 */
        .slide-tip {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg) translateZ(0);
            transform-origin: left center;
            font-size: 18px;
            color: #00c8ff;
            letter-spacing: 2px;
            cursor: pointer;
            z-index: 100;
            text-shadow: 0 0 8px #00c8ff, 0 0 12px #00c8ff50;
        }
        /* 双端容器 - 消除空白+缩放隔离核心 */
        .page-container {
            width: 200vw;
            height: 100vh;
            display: flex;
            position: relative;
            z-index: 1;
            transition: transform 0.4s ease-out;
            overflow: hidden;
            transform: translateZ(0); /* 硬件加速 */
        }
        /* 单端大格子 - 满宽满高 无任何空白 */
        .page {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: rgba(0, 15, 35, 0.85);
            overflow: hidden;
        }
        /* 切换偏移 - 精准100vw 无露边 */
        .page-container.slide {
            transform: translateX(-100vw) translateZ(0);
        }
        /* 通用标题 - 科技风霓虹光效 */
        .title {
            font-size: 32px;
            margin-bottom: 20px;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00c8ff, 0 0 15px #00c8ff50;
        }
        /* 通用描述 - 科技风浅蓝 保留原排版 */
        .desc {
            font-size: 16px;
            line-height: 1.8;
            max-width: 600px;
            margin-bottom: 40px;
            color: #80d8ff;
            text-shadow: 0 0 5px #00c8ff30;
        }
        /* 付费端专属样式 - 完全保留原内容+排版 */
        .pay-desc {
            line-height: 2;
        }
        .discount {
            color: #ff4d4d;
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 0 0 8px #ff4d4d, 0 0 12px #ff4d4d50;
        }
        /* 科技风按钮 - 轻量hover 低配机流畅 */
        .btn {
            display: inline-block;
            padding: 14px 30px;
            margin: 10px;
            background: #0a2a4a;
            border: 1px solid #00c8ff;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.2s ease;
            text-shadow: 0 0 5px #00c8ff;
        }
        .btn:hover {
            background: #0d365f;
            border-color: #00ffff;
            transform: scale(1.03);
            box-shadow: 0 0 10px #00c8ff50;
        }
        /* 端标识角标 - 公益/付费清晰区分 */
        .page-tag {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            padding: 6px 15px;
            border-radius: 30px;
            background: rgba(0, 200, 255, 0.2);
            border: 1px solid #00c8ff;
            color: #00c8ff;
            text-shadow: 0 0 5px #00c8ff;
        }
        .pay-tag {
            background: rgba(255, 77, 77, 0.2);
            border-color: #ff4d4d;
            color: #ff4d4d;
            text-shadow: 0 0 5px #ff4d4d;
        }
        /* 移动端/低配机专属适配 */
        @media (max-width: 768px) {
            .title {font-size: 26px;}
            .desc {font-size: 15px; max-width: 90%;}
            .btn {padding: 12px 25px; font-size: 15px;}
            .slide-tip {font-size: 16px; left: 15px;}
            .page-tag {font-size: 12px; top: 15px; right: 15px;}
        }
    </style>
</head>

    <script>
        // 极简JS - 低配机零卡顿 核心功能完整
        const slideTip = document.getElementById('slideTip');
        const pageContainer = document.getElementById('pageContainer');
        let isSlide = false;
        let startX = 0;

        // 禁止触屏默认行为 减少卡顿
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        // 点击切换 - 公益↔付费
        slideTip.onclick = () => {
            pageContainer.classList.toggle('slide');
            isSlide = !isSlide;
            slideTip.innerText = isSlide ? '往左滑' : '往右滑';
        };

        // 拖拽开始 - 仅记录坐标 无冗余计算
        function handleStart(e) {
            startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            pageContainer.style.transition = 'none';
        }

        // 拖拽结束 - 精准判定 丝滑切换
        function handleEnd(e) {
            const endX = e.type === 'touchend' ? e.changedTouches[0].clientX : e.clientX;
            const diffX = startX - endX;
            pageContainer.style.transition = 'transform 0.4s ease-out';

            // 40px灵敏判定 适配低配机触屏
            if (diffX > 40 && !isSlide) {
                pageContainer.classList.add('slide');
                slideTip.innerText = '往左滑';
                isSlide = true;
            } else if (diffX < -40 && isSlide) {
                pageContainer.classList.remove('slide');
                slideTip.innerText = '往右滑';
                isSlide = false;
            }
            startX = 0;
        }

        // 绑定拖拽事件 - 鼠标+触屏 全端支持
        document.addEventListener('touchstart', handleStart);
        document.addEventListener('touchend', handleEnd);
        document.addEventListener('mousedown', handleStart);
        document.addEventListener('mouseup', handleEnd);
        document.addEventListener('mouseleave', handleEnd);

        // 窗口缩放/大小变化 - 强制锁定位置 消除空白+缩放隔离
        window.onresize = () => {
            pageContainer.style.transform = isSlide ? 'translateX(-100vw) translateZ(0)' : 'translateX(0) translateZ(0)';
        };

        // 页面加载完成 - 硬件加速 低配机更流畅
        window.onload = () => {
            pageContainer.style.transform = isSlide ? 'translateX(-100vw) translateZ(0)' : 'translateX(0) translateZ(0)';
        };
    </script>
